name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: 下载依赖
        run: go mod download

      - name: 格式检查
        run: make fmt-check

      - name: 构建
        run: |
          go build ./cmd/sn-cli
          go build ./cmd/sn-server

      - name: 静态检查
        run: go vet ./...

      - name: 串行测试
        run: make test-serial

      - name: 并行测试
        run: go test ./... -count=1

      - name: Race 门禁
        run: make test-race

      - name: 覆盖率门禁
        run: make coverage COVERAGE_PROFILE=/tmp/sn-runtime-coverage.out COVERAGE_MIN=65.0
