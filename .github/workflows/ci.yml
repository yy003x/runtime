name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_provider_smoke:
        description: "运行真实 Provider smoke（会产生 API 调用）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: 下载依赖
        run: go mod download

      - name: 格式检查
        run: make fmt-check

      - name: 构建
        run: |
          go build ./cmd/sn-cli
          go build ./cmd/sn-server

      - name: 静态检查
        run: go vet ./...

      - name: 串行测试
        timeout-minutes: 10
        run: make test-serial

      - name: 并行测试
        timeout-minutes: 10
        run: go test ./... -count=1

      - name: Race 门禁
        timeout-minutes: 12
        run: make test-race

      - name: 覆盖率门禁
        timeout-minutes: 10
        run: |
          make coverage COVERAGE_PROFILE=/tmp/sn-runtime-coverage.out COVERAGE_MIN=65.0
          make coverage-critical

  real-provider-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.real_provider_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 真实 Provider smoke
        env:
          SN_REAL_PROVIDER_SMOKE: "1"
          SN_SMOKE_PROFILE: api-openai-agent
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: make provider-smoke
